<template>

</div>
<script>
(function(){
const S = [{"t0": 0.0, "t1": 5.8, "label": "HIS HEIGHT", "sub": "WEIGHT ~70 KG", "mode": "num:2: M", "v0": 1.85, "v1": 1.85, "value": ""}, {"t0": 5.8, "t1": 8.6, "label": "HIS HEIGHT", "sub": "WEIGHT 1.1 T", "mode": "num:2: M", "v0": 1.85, "v1": 4.63, "value": ""}, {"t0": 8.6, "t1": 11.0, "label": "HIS HEIGHT", "sub": "WEIGHT 8.8 T", "mode": "num:1: M", "v0": 4.63, "v1": 9.25, "value": ""}, {"t0": 11.0, "t1": 14.5, "label": "HIS HEIGHT", "sub": "WEIGHT 70 T", "mode": "num:1: M", "v0": 9.25, "v1": 18.5, "value": ""}, {"t0": 14.5, "t1": 21.0, "label": "HIS HEIGHT", "sub": "70 T = ARGENTINOSAURUS", "mode": "num:1: M", "v0": 18.5, "v1": 18.5, "value": ""}, {"t0": 21.0, "t1": 23.6, "label": "HIS HEIGHT", "sub": "WEIGHT 1,100 T", "mode": "num:0: M", "v0": 18.5, "v1": 46, "value": ""}, {"t0": 23.6, "t1": 26.8, "label": "HIS HEIGHT", "sub": "WEIGHT 8,750 T", "mode": "num:0: M", "v0": 46, "v1": 92.5, "value": ""}, {"t0": 26.8, "t1": 30.0, "label": "HIS HEIGHT", "sub": "WEIGHT 70,000 T", "mode": "num:0: M", "v0": 92.5, "v1": 185, "value": ""}, {"t0": 30.0, "t1": 36.0, "label": "HIS HEIGHT", "sub": "TITANIC 52,000 T \u00b7 CN TOWER 553 M", "mode": "num:0: M", "v0": 185, "v1": 185, "value": ""}, {"t0": 36.0, "t1": 40.0, "label": "HIS VOICE", "sub": "HUMANS HEAR FROM 20 HZ", "mode": "num:0: HZ", "v0": 300, "v1": 3, "value": ""}, {"t0": 40.0, "t1": 48.0, "label": "HIS VOICE", "sub": "INFRASOUND \u00b7 YOU ONLY FEEL IT", "mode": "num:0: HZ", "v0": 3, "v1": 3, "value": ""}, {"t0": 48.0, "t1": 54.6, "label": "BLOOD PRESSURE NEEDED", "sub": "TO REACH HIS BRAIN \u00b7 NORMAL 0.16", "mode": "num:1: ATM", "v0": 0.16, "v1": 4.1, "value": ""}, {"t0": 54.6, "t1": 57.5, "label": "HIS BRAIN", "sub": "NO BLOOD", "mode": "text", "v0": 0, "v1": 0, "value": "BLACKOUT"}, {"t0": 57.5, "t1": 64.0, "label": "HIS HEIGHT", "sub": "SQUARE-CUBE LAW", "mode": "text", "v0": 0, "v1": 0, "value": "TOO BIG"}];
const el = (id)=>document.getElementById(id);
const p2 = (n)=>String(Math.floor(n)).padStart(2,"0");
function fmt(seg, t){
  const k = seg.t1>seg.t0 ? Math.min(1,Math.max(0,(t-seg.t0)/(seg.t1-seg.t0))) : 1;
  const v = seg.v0 + (seg.v1-seg.v0)*k;
  if(seg.mode==="sec"){ const s=Math.max(0,v); const m=Math.floor(s/60); return m+":"+p2(s%60)+"."+String(Math.floor((s%1)*1000)).padStart(3,"0"); }
  if(seg.mode==="count"){ return Math.round(Math.max(0,v)).toLocaleString("en-US"); }
  if(seg.mode.indexOf("num")===0){ const pr=seg.mode.split(":"); const dec=+(pr[1]||0); return v.toLocaleString("en-US",{minimumFractionDigits:dec,maximumFractionDigits:dec})+(pr.slice(2).join(":")||""); }
  if(seg.mode==="pct"){ const r=Math.round(v); return (r>0?"+":"")+r+"%"; }
  if(seg.mode==="days"){ const d=Math.max(0,v); const dd=Math.floor(d); const h=(d-dd)*24; const mi=(h%1)*60; const se=(mi%1)*60;

}
const BCS = [{"t0": 18.2, "t1": 21.0, "label": "HE KEEPS GROWING IN", "n0": 3, "n1": 0}];
function renderBC(t){
  let b=null; for(const s of BCS){ if(s.t0<=t && t<s.t1) b=s; }
  const e=el("bc"); if(!b){ e.style.opacity=0; return; }
  const k=Math.min(1,Math.max(0,(t-b.t0)/(b.t1-b.t0))); const v=b.n0+(b.n1-b.n0)*k; const n=Math.ceil(v-1e-6);
  const frac=v-Math.floor(v); e.style.opacity=Math.min(1,(t-b.t0)/0.2,(b.t1-t)/0.2);
  el("bc-label").textContent=b.label; el("bc-num").textContent=String(n);
  el("bc-num").style.transform="scale("+(1+0.18*Math.max(0,frac-0.8)*5)+")";
}
function render(t){
  renderBC(t);
  let seg=null; for(const s of S){ if(s.t0<=t && t<s.t1) seg=s; }
  const w=el("wg");
  if(!seg){ w.style.opacity=0; return; }
  const fadeIn=Math.min(1,(t-seg.t0)/0.25), fadeOut=Math.min(1,(seg.t1-t)/0.25);
  const prev=S.find(s=>Math.abs(s.t1-seg.t0)<1e-3 && s.label===seg.label);
  const next=S.find(s=>Math.abs(s.t0-seg.t1)<1e-3 && s.label===seg.label);
  w.style.opacity = Math.min(prev?1:fadeIn, next?1:fadeOut);
  el("wg-label").textContent=seg.label; el("wg-sub").textContent=seg.sub; el("wg-value").textContent=fmt(seg,t);
}
const tl = gsap.timeline({paused:true,defaults:{lazy:false}});
const st={t:0};
tl.to(st,{t:64.0,duration:64.0,ease:"none",onUpdate:()=>render(st.t)},0);
render(0);
window.__timelines["widget"] = tl;
})();
</script>
